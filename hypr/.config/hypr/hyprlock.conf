general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# Blurred screenshot background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Avatar circle (initials fallback)
shape {
    monitor =
    size = 100, 100
    color = rgba(255, 255, 255, 0.15)
    rounding = -1
    border_size = 3
    border_color = rgba(255, 255, 255, 0.4)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = B
    color = rgba(255, 255, 255, 0.9)
    font_size = 42
    font_family = Noto Sans Bold
    position = 0, 200
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = Noto Sans Bold
    position = 0, 30
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = Noto Sans
    position = 0, -40
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    check_color = rgba(100, 220, 100, 0.9)
    fail_color = rgba(220, 60, 60, 0.9)
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    rounding = 10
    position = 0, -110
    halign = center
    valign = center
}
